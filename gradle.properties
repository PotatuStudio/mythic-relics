org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Loaders: un módulo común + uno por loader (Architectury)
enabled_platforms=fabric,neoforge

minecraft_version=26.3
mod_version=0.1.0+26.3
maven_group=io.github.potatustudio
archives_name=mythicrelics

# Dependencias
architectury_api_version=22.0.5
fabric_loader_version=0.20.1
fabric_api_version=0.165.2+26.3
neoforge_version=26.3.0.101
# Accesorios: Trinkets Updated en Fabric y Curios en NeoForge (el estándar de cada loader)
trinkets_version=4.2.1+26.3
curios_version=17.0.0+26.3
# JEI: integración opcional (compileOnly con la API común; el mod corre sin JEI)
jei_version=31.17.0.109
# Modonomicon: libro de reliquias (solo datos; dependencia opcional del mod)
modonomicon_version=2.20.1

# Solo desarrollo
modmenu_version=21.0.0
# Jade (vida y datos del mob al mirarlo): solo en desarrollo; el jugador lo instala aparte.
jade_version=26.3.5
# Rendimiento y shaders en desarrollo (grabar contenido y probar estabilidad). Iris 1.11.7 pide Sodium 0.9.2.
sodium_version=mc26.3-0.9.2
iris_version=1.11.7+26.3
complementary_version=r5.9.3
# Luz dinámica de verdad (cada cuadro) para el hinojo de Prometeo; si está instalada, el mod la usa. Solo en Fabric:
# es un único jar que pide Fabric API.
lambdynamiclights_version=4.13.0+26.3

loom.ignoreDependencyLoomVersionValidation=true
