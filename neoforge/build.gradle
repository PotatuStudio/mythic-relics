apply plugin: "com.gradleup.shadow"

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	// Lo que se empaqueta dentro del jar del loader (el módulo común ya transformado).
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
	implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
	// Curios: se compila contra su API y en desarrollo corre el mod completo. El jugador instala Curios aparte.
	compileOnly "top.theillusivec4.curios:curios-neoforge:$rootProject.curios_version:api"
	localRuntime "top.theillusivec4.curios:curios-neoforge:$rootProject.curios_version"

	// JEI: compila contra la API común; en desarrollo (runClient) corre JEI completo. No va dentro del jar.
	compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:$rootProject.jei_version"
	localRuntime "mezz.jei:jei-${rootProject.minecraft_version}-neoforge:$rootProject.jei_version"
	// Jade: al mirar un mob muestra su vida (para probar el daño de las reliquias).
	localRuntime "maven.modrinth:jade:${rootProject.jade_version}+neoforge"
	// Libro de reliquias (solo datos). Sin transitivas: el jar ya trae sus bibliotecas.
	localRuntime("com.klikli_dev:modonomicon-${rootProject.minecraft_version}-neoforge:$rootProject.modonomicon_version") { transitive = false }

	common(project(path: ":common")) { transitive false }
	shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
	inputs.property "version", project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

// Como en Architectury API: el jar "raw" es solo de este módulo; el jar final (sin clasificador) lo arma Shadow
// juntando este módulo con el común ya transformado para el loader.
jar {
	archiveClassifier = "raw"
}

shadowJar {
	dependsOn jar
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = null
	exclude "architectury.common.json"
}

assemble.dependsOn shadowJar
