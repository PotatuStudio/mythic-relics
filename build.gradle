plugins {
	id "architectury-plugin" version "3.5-SNAPSHOT"
	id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
	id "com.gradleup.shadow" version "9.4.3" apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: "java-library"
	apply plugin: "architectury-plugin"
	apply plugin: "dev.architectury.loom-no-remap"

	base {
		archivesName = "$rootProject.archives_name-$project.name"
	}

	repositories {
		maven { url "https://maven.neoforged.net/releases/" }
		maven { url "https://maven.architectury.dev/" }
		// Trinkets Updated (espacios de accesorios; un mismo jar para Fabric y NeoForge).
		exclusiveContent {
			forRepository {
				maven {
					name = "Nucleoid"
					url = "https://maven.nucleoid.xyz/releases"
				}
			}
			filter { includeGroup "eu.pb4" }
		}
		// JEI (integración opcional: páginas de "dónde encontrarlo") y su biblioteca de configuración.
		exclusiveContent {
			forRepository {
				maven {
					name = "BlameJared"
					url = "https://maven.blamejared.com"
				}
			}
			filter {
				includeGroup "mezz.jei"
				includeGroup "net.mezzdev.config"
			}
		}
		exclusiveContent {
			forRepository {
				maven {
					name = "Modrinth"
					url = "https://api.modrinth.com/maven"
				}
			}
			filter { includeGroup "maven.modrinth" }
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = "UTF-8"
		options.release = 25
	}
}
